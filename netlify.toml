# Netlify: builds the static site and serves it. The front page, /login and /signup are plain
# HTML drawn at build time; every other page loads the app from one shell (_shell.html).

[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # Public addresses of the Neon project. They end up in the browser anyway, so they are not
  # secrets. DATABASE_URL is a secret and is never needed here: it is only for `pnpm db:migrate`
  # on your own machine.
  VITE_NEON_AUTH_URL = "https://ep-still-term-bapw7e1f.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth"
  VITE_NEON_DATA_API_URL = "https://ep-still-term-bapw7e1f.apirest.c-8.eu-central-1.aws.neon.tech/neondb/rest/v1"
  # Netlify's secret scanner fails a build when a value marked as secret shows up in the repo
  # or in the built files. These two are public and are meant to be in the built files, so the
  # scanner is told to leave them alone. Everything else (DATABASE_URL, if it is ever set in
  # Netlify) is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_NEON_AUTH_URL,VITE_NEON_DATA_API_URL"

# Pages drawn at build time are files (/, /login/index.html, /signup/index.html) and Netlify
# serves them as they are. Every other address is the app's (/acme, /organizations, …): the shell.
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have a hash in their name, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The pages drawn at build time change with each deploy: always checked again.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/landing/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
