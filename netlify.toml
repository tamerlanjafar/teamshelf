# Netlify, for the app (apps/web): builds the static site and serves it. It is at the top of the
# repository so a site connected to it needs no settings of its own: `base` says where the app is.
# The back office is a second site, with its own file (apps/back-office/netlify.toml) and its base
# directory set in Netlify.
#
# The front page, /login and /signup are plain
# HTML drawn at build time; every other page loads the app from one shell (_shell.html).

[build]
  # Everything below is relative to this folder: the build's output, and netlify/functions.
  base = "apps/web"
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # The site's variables are set in Netlify, not here (`pnpm cloud` sets them, see SETUP.md).
  # The two Neon addresses are public and end up in the built files, so Netlify's secret scanner
  # is told to leave them alone. Everything else is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_NEON_AUTH_URL,VITE_NEON_DATA_API_URL"

# Pages drawn at build time are files (/, /login/index.html, /signup/index.html) and Netlify
# serves them as they are. Every other address is the app's (/acme, /organizations, …): the shell.
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # No page of another site may frame this one, change where its relative addresses point
    # (<base>), embed plugins, or receive its forms. Scripts and images are not restricted here:
    # link icons load from any site, and the pages carry small inline scripts.
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# Built files have a hash of their content in their name (scripts, styles, and the front page's
# screenshots, src/features/landing/shots.ts), so they can be cached for good: a changed file is a
# new address. Keep anything that changes out of public/ under a fixed name for long.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The pages drawn at build time change with each deploy: always checked again.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
