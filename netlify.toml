# Netlify: builds the static site and serves it. There is no server code.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public addresses of the Neon project. They end up in the browser anyway, so they are not
  # secrets. DATABASE_URL is a secret and is never needed here: it is only for `pnpm db:migrate`
  # on your own machine.
  VITE_NEON_AUTH_URL = "https://ep-still-term-bapw7e1f.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth"
  VITE_NEON_DATA_API_URL = "https://ep-still-term-bapw7e1f.apirest.c-8.eu-central-1.aws.neon.tech/neondb/rest/v1"

# Every address is handled by the app itself (/caspiantech, /login, …), so they all get index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have a hash in their name, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
