<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14151c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teamshelf</title>
    <meta name="description" content="Your team's links and files, in one place." />
    <!-- Link previews. %SITE_URL% is the site's address, filled in at build time (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Teamshelf" />
    <meta property="og:title" content="Teamshelf" />
    <meta property="og:description" content="Your team's links and files, in one place." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="team/shelf: your team's links and files, in one place." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The theme, before the first paint. src/lib/theme.ts keeps it up to date afterwards.
      try {
        var choice = localStorage.getItem('teamshelf-theme')
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
